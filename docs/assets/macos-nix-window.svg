<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">macOS nix-darwin setup</title>
  <desc id="desc">A single macOS terminal window for the macbook-pro nix-darwin setup.</desc>
  <defs>
    <linearGradient id="terminal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset=".55" stop-color="#111c2d"/>
      <stop offset="1" stop-color="#172338"/>
    </linearGradient>
    <linearGradient id="toolbar" x1="0" x2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#e9f1f9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-30%" width="116%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#06111f" flood-opacity=".36"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="960" height="360" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="86" y="52" width="788" height="256" rx="24" fill="url(#terminal)"/>
    <rect x="86" y="52" width="788" height="256" rx="24" fill="#fff" filter="url(#grain)" opacity=".55"/>

    <clipPath id="window-clip">
      <rect x="86" y="52" width="788" height="256" rx="24"/>
    </clipPath>

    <g clip-path="url(#window-clip)">
      <rect x="86" y="52" width="788" height="46" fill="url(#toolbar)"/>
      <circle cx="122" cy="75" r="7" fill="#ff5f57"/>
      <circle cx="147" cy="75" r="7" fill="#ffbd2e"/>
      <circle cx="172" cy="75" r="7" fill="#28c840"/>
      <rect x="388" y="65" width="184" height="20" rx="10" fill="#dce6f0"/>
      <text x="424" y="79" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">macbook-pro</text>

      <path d="M86 98h788v92C604 124 353 139 86 208Z" fill="url(#sweep)" opacity=".45"/>

      <text x="138" y="152" fill="#7dd3fc" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700">macbook-pro</text>
      <text x="138" y="194" fill="#e5edf8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">brew.casks = apps + utilities</text>
      <text x="138" y="232" fill="#a7f3d0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">cli = deno + bun + kubectl</text>
      <text x="138" y="270" fill="#f8fafc" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">macOS defaults + secrets</text>

      <g transform="translate(674 244)">
        <rect width="134" height="28" rx="14" fill="#20314c"/>
        <circle cx="18" cy="14" r="5" fill="#34d399"/>
        <text x="32" y="19" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">macOS first</text>
      </g>
    </g>
  </g>
</svg>
